name: Build MAX AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MAX AI APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONNOUSERSITE: "0"
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            ccache \
            libncurses5 \
            libncursesw5 \
            libtinfo5

      - name: Install Buildozer outside virtualenv
        run: |
          python -m pip install --user --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install --user \
            "Cython==0.29.36" \
            "buildozer==1.5.0" \
            "build"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify project files
        run: |
          test -f buildozer.spec
          test -f main.py

          echo "Project files verified."
          python --version
          buildozer --version

      - name: Verify Android configuration
        run: |
          grep -n '^requirements' buildozer.spec
          grep -n '^android.api' buildozer.spec
          grep -n '^android.minapi' buildozer.spec
          grep -n '^android.archs' buildozer.spec

      - name: Build MAX AI APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-BUILD-LOG
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
