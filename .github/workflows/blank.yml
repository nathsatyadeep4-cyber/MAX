name: MAX ULTRA Calculator Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Check HTML
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html is missing from the repository root."
            exit 1
          fi

      - name: Upload calculator files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy calculator
        id: deployment
        uses: actions/deploy-pages@v4
