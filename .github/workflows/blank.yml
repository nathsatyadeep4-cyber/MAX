name: Build MAX AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      PIP_USER: "false"
      PYTHONNOUSERSITE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            python3 python3-venv python3-pip \
            build-essential autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            libltdl-dev

      - name: Create isolated Buildozer environment
        run: |
          python3 -m venv "$RUNNER_TEMP/buildenv"
          "$RUNNER_TEMP/buildenv/bin/python" -m pip install --upgrade \
            pip setuptools wheel
          "$RUNNER_TEMP/buildenv/bin/python" -m pip install \
            "Cython==0.29.36" \
            "buildozer==1.5.0"
          echo "$RUNNER_TEMP/buildenv/bin" >> "$GITHUB_PATH"

      - name: Verify project files
        run: |
          set -eu
          test -f main.py || {
            echo "::error::main.py is missing from repository root"
            exit 1
          }
          test -f buildozer.spec || {
            echo "::error::buildozer.spec is missing from repository root"
            exit 1
          }
          python3 -m py_compile main.py
          echo "Project files verified."

      - name: Build MAX AI APK
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/buildenv/bin:$PATH"
          unset VIRTUAL_ENV || true
          unset PYTHONHOME || true

          # Prevent pip from trying a user-site installation.
          export PIP_USER=false
          export PYTHONNOUSERSITE=1

          buildozer --version
          buildozer android debug

      - name: Check APK output
        if: success()
        run: |
          set -eu
          find bin -maxdepth 1 -type f -name "*.apk" -print
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)" || {
            echo "::error::Build finished but no APK was found in bin/"
            exit 1
          }

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
