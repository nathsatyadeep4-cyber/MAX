name: Build MAX AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3 python3-pip python3-venv \
            build-essential autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            ccache

      - name: Install Buildozer
        run: |
          python3 -m venv "$HOME/buildozer-venv"
          source "$HOME/buildozer-venv/bin/activate"

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          echo "$HOME/buildozer-venv/bin" >> "$GITHUB_PATH"

          buildozer --version

      - name: Verify Android project
        run: |
          set -eu

          test -f main.py || {
            echo "ERROR: main.py missing"
            exit 1
          }

          test -f buildozer.spec || {
            echo "ERROR: buildozer.spec missing"
            exit 1
          }

          python3 -m py_compile main.py

          echo "Project files verified."

      - name: Build MAX AI APK
        env:
          PIP_USER: "false"
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          set -euo pipefail

          export PATH="$HOME/buildozer-venv/bin:$HOME/.local/bin:$PATH"

          unset VIRTUAL_ENV
          unset PYTHONHOME
          unset PYTHONUSERBASE

          yes | buildozer android debug 2>&1 | tee build.log

      - name: Check APK files
        if: always()
        run: |
          echo "Searching for APK files..."

          find . -type f -name "*.apk" \
            -not -path "./.git/*" \
            -print | tee apk-files.txt

          echo "Checking bin directory..."
          ls -lah bin/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-Build-Log
          path: |
            build.log
            apk-files.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-APK
          path: |
            bin/**/*.apk
            bin/*.apk
          if-no-files-found: warn
          retention-days: 7
