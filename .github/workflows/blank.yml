name: Build MAX AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MAX AI APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            ccache \
            libncurses5 \
            libncursesw5 \
            libtinfo5

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade \
            pip setuptools wheel

          python -m pip install \
            "Cython==0.29.36" \
            "buildozer==1.5.0" \
            "build"

          buildozer --version

      - name: Verify project
        run: |
          test -f main.py
          test -f buildozer.spec

          if ! grep -Eq '^android\.accept_sdk_license[[:space:]]*=[[:space:]]*True' buildozer.spec; then
            echo "::error::Add 'android.accept_sdk_license = True' under [app] in buildozer.spec"
            exit 1
          fi

          echo "Project files verified."
          python --version

      - name: Cache Buildozer SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build MAX AI APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-BUILD-LOG
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
