name: Build MAX AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Android build dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3 python3-pip \
            build-essential \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6

      # 4. Install Buildozer outside a virtual environment
      - name: Install Buildozer
        run: |
          unset VIRTUAL_ENV
          unset PYTHONHOME
          unset PIP_USER

          python3 -m pip install \
            --user \
            --break-system-packages \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # 5. Verify project files
      - name: Check project files
        run: |
          echo "Checking project files..."

          test -f main.py || {
            echo "ERROR: main.py is missing"
            exit 1
          }

          test -f buildozer.spec || {
            echo "ERROR: buildozer.spec is missing"
            exit 1
          }

          python3 -m py_compile main.py

          echo "Project files found."
          echo "Python syntax is valid."

      # 6. Build the APK
      - name: Build MAX AI APK
        env:
          PIP_USER: "0"
        run: |
          unset VIRTUAL_ENV
          unset PYTHONHOME

          export PATH="$HOME/.local/bin:$PATH"

          buildozer android debug

      # 7. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
