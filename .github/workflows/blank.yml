name: Build MAX AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MAX AI APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      PIP_USER: "false"
      PYTHONNOUSERSITE: "1"
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            ccache \
            libncurses5 \
            libncursesw5 \
            libtinfo5

      - name: Create build environment
        run: |
          python -m venv "$HOME/buildozer-venv"
          echo "$HOME/buildozer-venv/bin" >> "$GITHUB_PATH"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0" "build"

      - name: Verify project files
        run: |
          test -f buildozer.spec
          test -f main.py
          echo "Project files verified."

      - name: Verify configuration
        run: |
          grep -n 'requirements' buildozer.spec
          grep -n 'android.api' buildozer.spec
          grep -n 'android.minapi' buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 7
