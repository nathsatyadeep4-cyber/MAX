name: Build MAX AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3 python3-venv python3-pip \
            build-essential autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev libtinfo6

      - name: Install Buildozer
        run: |
          python3 -m venv "$HOME/buildenv"
          "$HOME/buildenv/bin/python" -m pip install --upgrade pip setuptools wheel
          "$HOME/buildenv/bin/python" -m pip install "Cython==0.29.36" "buildozer==1.5.0"
          echo "$HOME/buildenv/bin" >> "$GITHUB_PATH"

      - name: Verify project files
        run: |
          test -f main.py || { echo "ERROR: main.py missing"; exit 1; }
          test -f buildozer.spec || { echo "ERROR: buildozer.spec missing"; exit 1; }
          python3 -m py_compile main.py
          echo "Project files verified."

      - name: Build MAX AI APK
        env:
          PIP_USER: "false"
        run: |
          unset VIRTUAL_ENV
          unset PYTHONHOME
          export PATH="$HOME/buildenv/bin:$PATH"
          buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
