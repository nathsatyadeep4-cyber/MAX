name: Build MAX AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3 python3-pip \
            build-essential autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            ccache

      - name: Install Buildozer outside virtualenv
        run: |
          python3 -m pip install --user --upgrade \
            pip setuptools wheel

          python3 -m pip install --user \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/buildozer" --version

      - name: Verify Android project
        run: |
          set -eu

          if [ ! -f main.py ]; then
            echo "ERROR: main.py missing from repository root"
            exit 1
          fi

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec missing from repository root"
            exit 1
          fi

          python3 -m py_compile main.py

          echo "Project files verified."

      - name: Build MAX AI APK
        env:
          PIP_USER: "true"
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          set -eu

          export PATH="$HOME/.local/bin:$PATH"

          unset VIRTUAL_ENV
          unset PYTHONHOME

          buildozer android debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
