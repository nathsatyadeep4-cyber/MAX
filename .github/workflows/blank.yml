name: Build MAX AI APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3-pip python3-venv \
            build-essential autoconf libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Create Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/buildenv"
          echo "$RUNNER_TEMP/buildenv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/buildenv/bin/python" -m pip install --upgrade pip setuptools wheel
          "$RUNNER_TEMP/buildenv/bin/python" -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Verify project files
        run: |
          test -f main.py
          test -f buildozer.spec
          python -m py_compile main.py

      - name: Build Android APK
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          export VIRTUAL_ENV_DISABLE_PROMPT=1
          export PIP_USER=false
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-AI-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
